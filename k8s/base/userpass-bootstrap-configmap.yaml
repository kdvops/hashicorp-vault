apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-userpass-bootstrap
  namespace: vault
data:
  bootstrap-userpass.sh: |
    #!/bin/sh
    set -eu

    : "${VAULT_ADDR:=http://vault.vault.svc.cluster.local:8200}"
    : "${HERMES_USERNAME:=hermes}"
    : "${HERMES_POLICIES:=admin}"
    : "${HERMES_MOUNT:=userpass}"
    : "${HERMES_TTL:=0}"

    if [ -z "${VAULT_TOKEN:-}" ]; then
      echo "VAULT_TOKEN is required" >&2
      exit 1
    fi

    if [ -z "${HERMES_PASSWORD:-}" ]; then
      echo "HERMES_PASSWORD is required" >&2
      exit 1
    fi

    export VAULT_ADDR VAULT_TOKEN

    echo "Waiting for Vault to become ready..."
    ready=0
    i=0
    until [ "$i" -ge 60 ]; do
      if vault status >/dev/null 2>&1; then
        ready=1
        break
      fi
      i=$((i + 1))
      sleep 5
    done

    if [ "$ready" -ne 1 ]; then
      echo "Vault never became ready" >&2
      exit 1
    fi

    if ! vault auth list 2>/dev/null | grep -q "^${HERMES_MOUNT}/"; then
      echo "Enabling userpass auth at ${HERMES_MOUNT}/"
      vault auth enable "${HERMES_MOUNT}"
    else
      echo "userpass auth already enabled at ${HERMES_MOUNT}/"
    fi

    echo "Upserting user ${HERMES_USERNAME} with policies: ${HERMES_POLICIES}"
    vault write "auth/${HERMES_MOUNT}/users/${HERMES_USERNAME}" \
      password="${HERMES_PASSWORD}" \
      policies="${HERMES_POLICIES}" \
      token_ttl="${HERMES_TTL}"

    echo "Userpass bootstrap completed for ${HERMES_USERNAME}"
