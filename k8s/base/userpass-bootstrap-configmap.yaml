apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-userpass-bootstrap
  namespace: vault
data:
  bootstrap-userpass.sh: |
    #!/bin/sh
    set -eu

    : "${VAULT_ADDR:=http://vault.vault.svc.cluster.local:8200}"
    : "${KALCALA_USERNAME:=kalcala}"
    : "${KALCALA_POLICIES:=default}"
    : "${KALCALA_MOUNT:=userpass}"
    : "${KALCALA_TTL:=0}"

    if [ -z "${VAULT_TOKEN:-}" ]; then
      echo "VAULT_TOKEN is required" >&2
      exit 1
    fi

    if [ -z "${KALCALA_PASSWORD:-}" ]; then
      echo "KALCALA_PASSWORD is required" >&2
      exit 1
    fi

    export VAULT_ADDR VAULT_TOKEN

    echo "Waiting for Vault to become ready..."
    ready=0
    i=0
    until [ "$i" -ge 60 ]; do
      if vault status >/dev/null 2>&1; then
        ready=1
        break
      fi
      i=$((i + 1))
      sleep 5
    done

    if [ "$ready" -ne 1 ]; then
      echo "Vault never became ready" >&2
      exit 1
    fi

    if ! vault auth list 2>/dev/null | grep -q "^${KALCALA_MOUNT}/"; then
      echo "Enabling userpass auth at ${KALCALA_MOUNT}/"
      vault auth enable "${KALCALA_MOUNT}"
    else
      echo "userpass auth already enabled at ${KALCALA_MOUNT}/"
    fi

    echo "Upserting user ${KALCALA_USERNAME} with policies: ${KALCALA_POLICIES}"
    vault write "auth/${KALCALA_MOUNT}/users/${KALCALA_USERNAME}" \
      password="${KALCALA_PASSWORD}" \
      policies="${KALCALA_POLICIES}" \
      token_ttl="${KALCALA_TTL}"

    echo "Userpass bootstrap completed for ${KALCALA_USERNAME}"
