apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-kubernetes-auth-bootstrap
  namespace: vault
data:
  bootstrap-kubernetes-auth.sh: |
    #!/bin/sh
    set -eu

    : "${VAULT_ADDR:=http://vault.vault.svc.cluster.local:8200}"
    : "${VAULT_NAMESPACE:=vault}"
    : "${K8S_AUTH_MOUNT:=kubernetes}"
    : "${K8S_ROLE_NAME:=hermes-agent}"
    : "${K8S_ROLE_NAMESPACE:=hermes}"
    : "${K8S_ROLE_SERVICE_ACCOUNT:=hermes-agent}"
    : "${K8S_ROLE_POLICIES:=admin}"
    : "${K8S_ROLE_TTL:=1h}"

    if [ -z "${VAULT_TOKEN:-}" ]; then
      echo "VAULT_TOKEN is required" >&2
      exit 1
    fi

    export VAULT_ADDR VAULT_NAMESPACE VAULT_TOKEN

    echo "Waiting for Vault to become ready..."
    ready=0
    i=0
    until [ "$i" -ge 60 ]; do
      if vault status >/dev/null 2>&1; then
        ready=1
        break
      fi
      i=$((i + 1))
      sleep 5
    done

    if [ "$ready" -ne 1 ]; then
      echo "Vault never became ready" >&2
      exit 1
    fi

    if ! vault auth list 2>/dev/null | grep -q "^${K8S_AUTH_MOUNT}/"; then
      echo "Enabling kubernetes auth at ${K8S_AUTH_MOUNT}/"
      vault auth enable "${K8S_AUTH_MOUNT}"
    else
      echo "kubernetes auth already enabled at ${K8S_AUTH_MOUNT}/"
    fi

    reviewer_jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
    kubernetes_ca_cert="$(cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)"
    kubernetes_host="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS:-443}"

    echo "Configuring kubernetes auth backend"
    vault write "auth/${K8S_AUTH_MOUNT}/config" \
      kubernetes_host="${kubernetes_host}" \
      kubernetes_ca_cert="${kubernetes_ca_cert}" \
      token_reviewer_jwt="${reviewer_jwt}"

    echo "Upserting role ${K8S_ROLE_NAME} for service account ${K8S_ROLE_SERVICE_ACCOUNT} in namespace ${K8S_ROLE_NAMESPACE}"
    vault write "auth/${K8S_AUTH_MOUNT}/role/${K8S_ROLE_NAME}" \
      bound_service_account_names="${K8S_ROLE_SERVICE_ACCOUNT}" \
      bound_service_account_namespaces="${K8S_ROLE_NAMESPACE}" \
      token_policies="${K8S_ROLE_POLICIES}" \
      token_ttl="${K8S_ROLE_TTL}"

    echo "Kubernetes auth bootstrap completed for ${K8S_ROLE_NAME}"
