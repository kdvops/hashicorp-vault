apiVersion: batch/v1
kind: Job
metadata:
  name: vault-userpass-bootstrap
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "20"
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-userpass-bootstrap
    spec:
      serviceAccountName: vault
      restartPolicy: Never
      containers:
        - name: vault-cli
          image: hashicorp/vault:2.0.3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /scripts/bootstrap-userpass.sh
          env:
            - name: VAULT_ADDR
              value: http://vault.vault.svc.cluster.local:8200
            - name: HERMES_USERNAME
              value: hermes
            - name: HERMES_POLICIES
              value: admin
            - name: HERMES_MOUNT
              value: userpass
            - name: HERMES_TTL
              value: "0"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-bootstrap-token
                  key: token
            - name: HERMES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vault-userpass-hermes
                  key: password
          volumeMounts:
            - name: bootstrap-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: bootstrap-script
          configMap:
            name: vault-userpass-bootstrap
            defaultMode: 0755
            items:
              - key: bootstrap-userpass.sh
                path: bootstrap-userpass.sh
